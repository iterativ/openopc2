name: Build EXE
on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure pipx paths
        shell: pwsh
        run: |
          "PIPX_HOME=$env:RUNNER_TEMP\pipx" >> $env:GITHUB_ENV
          "PIPX_BIN_DIR=$env:RUNNER_TEMP\pipx-bin" >> $env:GITHUB_ENV
      - name: Set up Python for Poetry
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: '1.8.4'
      - name: Add Poetry to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value $env:PIPX_BIN_DIR
      - name: Set up Python for executables (32-bit)
        id: build_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: x86
      - name: Select 32-bit Python for the project
        shell: pwsh
        env:
          BUILD_PYTHON: ${{ steps.build_python.outputs.python-path }}
        run: |
          poetry env use "$env:BUILD_PYTHON"
          poetry run python -c "import struct, sys; assert sys.version_info[:2] == (3, 8) and struct.calcsize('P') == 4"
      - name: Register gbda_aut.dll
        run: |
          Copy-Item .\lib\gbda_aut.dll C:\Windows\System32\
          regsvr32 /s C:\Windows\System32\gbda_aut.dll
        shell: pwsh
      - name: Install dependencies
        run: poetry install
      - name: Build executables
        run: scripts/build_executables.ps1
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            dist/OpenOpcCli.exe
            dist/OpenOpcServer.exe
            dist/OpenOpcService.exe
          if-no-files-found: error

  check_release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.main.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the tagged commit is on main
        id: main
        shell: bash
        run: |
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if git merge-base --is-ancestor "$tag_commit" FETCH_HEAD; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [build, check_release]
    if: needs.check_release.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-executables
          path: dist
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*.exe

  publish_package:
    needs: [build, check_release]
    if: needs.check_release.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish to PyPI
        uses: JRubics/poetry-publish@v2.0
        with:
          pypi_token: ${{ secrets.PYPI_TOKEN }}
